<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Statistics Learning Hub</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>

  <link rel="icon" href="images/logo.png" />
</head>

<body class="bg-gray-50 text-gray-800">

<!-- ================= HEADER ================= -->
<header class="bg-yellow-400 shadow-md sticky top-0 z-50">
  <div class="container mx-auto flex justify-between items-center p-4">
    <a href="#" class="text-white text-2xl font-semibold">
      📊InSearchOfAverage
    </a>
  </div>
</header>

<!-- ================= HERO ================= -->
<section class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white py-20">
  <div class="max-w-5xl mx-auto text-center px-6">
    <h1 class="text-5xl font-bold mb-4">Get in Touch</h1>
    <p class="text-lg text-gray-200">
      Questions, feedback, or suggestions? Send us a message.
    </p>
  </div>
</section>

<!-- ================= CONTACT FORM ================= -->
<section class="max-w-4xl mx-auto py-16 px-6">
  <h2 class="text-3xl font-bold text-center text-blue-800 mb-8">
    Contact Form
  </h2>

  <form id="contactForm"
        class="bg-white shadow-xl rounded-lg p-8 space-y-6">

    <div>
      <label class="font-semibold">Full Name</label>
      <input id="name" type="text" required
        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="font-semibold">Email</label>
      <input id="email" type="email" required
        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="font-semibold">Subject</label>
      <input id="subject" type="text"
        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="font-semibold">Message</label>
      <textarea id="message" rows="5" required
        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <button type="submit"
      class="w-full bg-yellow-400 hover:bg-yellow-300 font-bold py-3 rounded-lg transition transform hover:scale-105">
      🚀 Send Message
    </button>

    <p id="status" class="text-center font-semibold"></p>
  </form>
</section>

<!-- ================= FOOTER ================= -->
<footer class="bg-blue-800 text-white py-6 text-center">
  <p>&copy; 2025 InSearchOfAverage. All rights reserved.</p>
</footer>

<!-- ================= JAVASCRIPT ================= -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  const form = document.getElementById("contactForm");
  const status = document.getElementById("status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      subject: document.getElementById("subject").value,
      message: document.getElementById("message").value
    };

    status.textContent = "⏳ Sending...";

    try {
      const response = await fetch(
        "https://script.google.com/macros/s/AKfycbx4TA19-N6rvA4IbKdiLJtYqQidfrD-OJfeVDe0K5FNCEFFuV8dke4_qu2Nx1X3LfSc/exec",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        }
      );

      if (response.ok) {
        status.textContent = "✅ Message sent successfully!";
        form.reset();
      } else {
        status.textContent = "❌ Failed to send message.";
      }

    } catch (err) {
      console.error(err);
      status.textContent = "❌ Network error.";
    }
  });

});
</script>

</body>
</html>
