<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Complete t-Test Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}
.container {
    max-width: 520px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
}
h2 {
    text-align: center;
    color: #2c3e50;
}
select, input, button {
    width: 100%;
    padding: 8px;
    margin: 8px 0;
}
button {
    background: #007bff;
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #0056b3;
}
.section {
    display: none;
}
.result {
    margin-top: 15px;
    padding: 12px;
    background: #ecf9f1;
    border-radius: 5px;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
<h2>Complete t-Test Calculator</h2>

<label>Select Test Type:</label>
<select id="testType" onchange="showSection()">
    <option value="">-- Select --</option>
    <option value="one">One-Sample t-Test</option>
    <option value="two">Two-Sample t-Test</option>
    <option value="paired">Paired t-Test</option>
</select>

<!-- One Sample -->
<div id="one" class="section">
    <h3>One-Sample t-Test</h3>
    <input type="number" id="mean1" placeholder="Sample Mean (x̄)">
    <input type="number" id="mu" placeholder="Population Mean (μ₀)">
    <input type="number" id="sd1" placeholder="Sample Std Dev (s)">
    <input type="number" id="n1" placeholder="Sample Size (n)">
</div>

<!-- Two Sample -->
<div id="two" class="section">
    <h3>Two-Sample t-Test (Independent)</h3>
    <input type="number" id="meanA" placeholder="Mean x̄₁">
    <input type="number" id="sdA" placeholder="Std Dev s₁">
    <input type="number" id="nA" placeholder="Sample Size n₁">

    <input type="number" id="meanB" placeholder="Mean x̄₂">
    <input type="number" id="sdB" placeholder="Std Dev s₂">
    <input type="number" id="nB" placeholder="Sample Size n₂">
</div>

<!-- Paired Sample -->
<div id="paired" class="section">
    <h3>Paired t-Test</h3>
    <input type="number" id="meanD" placeholder="Mean of Differences (d̄)">
    <input type="number" id="sdD" placeholder="Std Dev of Differences (s_d)">
    <input type="number" id="nD" placeholder="Number of Pairs (n)">
</div>

<label>Significance Level (α):</label>
<select id="alpha">
    <option value="0.05">0.05</option>
    <option value="0.01">0.01</option>
</select>

<label>Tail Type:</label>
<select id="tail">
    <option value="two">Two-Tailed</option>
    <option value="one">One-Tailed</option>
</select>

<button onclick="calculateT()">Calculate</button>

<div class="result" id="output"></div>

</div>

<script>
function showSection() {
    document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
    let type = document.getElementById('testType').value;
    if (type) document.getElementById(type).style.display = 'block';
}

// Approximate Student t CDF using normal distribution
function normalCDF(x) {
    return 0.5 * (1 + Math.erf(x / Math.sqrt(2)));
}

function calculateT() {
    let type = testType.value;
    let alpha = parseFloat(document.getElementById("alpha").value);
    let tail = document.getElementById("tail").value;

    let t = 0, df = 0;

    if (type === "one") {
        let mean = +mean1.value, mu0 = +mu.value;
        let sd = +sd1.value, n = +n1.value;
        t = (mean - mu0) / (sd / Math.sqrt(n));
        df = n - 1;
    }

    else if (type === "two") {
        let m1 = +meanA.value, s1 = +sdA.value, n1v = +nA.value;
        let m2 = +meanB.value, s2 = +sdB.value, n2v = +nB.value;
        let sp = Math.sqrt(((n1v-1)*s1*s1 + (n2v-1)*s2*s2) / (n1v+n2v-2));
        t = (m1 - m2) / (sp * Math.sqrt(1/n1v + 1/n2v));
        df = n1v + n2v - 2;
    }

    else if (type === "paired") {
        let md = +meanD.value, sd = +sdD.value, n = +nD.value;
        t = md / (sd / Math.sqrt(n));
        df = n - 1;
    }

    let p = tail === "two"
        ? 2 * (1 - normalCDF(Math.abs(t)))
        : 1 - normalCDF(Math.abs(t));

    let decision = p < alpha ? "Reject H₀" : "Fail to Reject H₀";

    output.innerHTML = `
        <b>t-value:</b> ${t.toFixed(4)}<br>
        <b>Degrees of Freedom:</b> ${df}<br>
        <b>p-value:</b> ${p.toFixed(4)}<br>
        <b>Decision:</b> ${decision}
    `;
}
</script>

</body>
</html>
