<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Z-Score Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }
        .container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 15px;
            text-align: center;
            font-size: 18px;
            color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Z-Score Calculator</h2>

    <label>Value (x):</label>
    <input type="number" id="x" placeholder="Enter value">

    <label>Mean (μ):</label>
    <input type="number" id="mean" placeholder="Enter mean">

    <label>Standard Deviation (σ):</label>
    <input type="number" id="sd" placeholder="Enter standard deviation">

    <button onclick="calculateZ()">Calculate Z-Score</button>

    <div class="result" id="output"></div>
</div>

<script>
function calculateZ() {
    let x = parseFloat(document.getElementById("x").value);
    let mean = parseFloat(document.getElementById("mean").value);
    let sd = parseFloat(document.getElementById("sd").value);

    if (isNaN(x) || isNaN(mean) || isNaN(sd)) {
        document.getElementById("output").innerHTML = "⚠️ Please enter all values.";
        return;
    }

    if (sd === 0) {
        document.getElementById("output").innerHTML = "⚠️ Standard deviation cannot be zero.";
        return;
    }

    let z = (x - mean) / sd;
    document.getElementById("output").innerHTML = 
        "Z-Score = <strong>" + z.toFixed(4) + "</strong>";
}
</script>

</body>
</html>
