<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One-Way ANOVA Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}
.container {
    max-width: 600px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
}
h2 {
    text-align: center;
    color: #2c3e50;
}
textarea {
    width: 100%;
    height: 80px;
    margin: 8px 0;
    padding: 8px;
}
button {
    width: 100%;
    padding: 10px;
    background: #007bff;
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #0056b3;
}
.result {
    margin-top: 15px;
    background: #ecf9f1;
    padding: 15px;
    border-radius: 5px;
}
small {
    color: #555;
}
</style>
</head>

<body>

<div class="container">
<h2>One-Way ANOVA Calculator</h2>

<p><b>Enter group data (comma separated):</b></p>

<label>Group 1:</label>
<textarea id="g1" placeholder="e.g. 12,15,14,10"></textarea>

<label>Group 2:</label>
<textarea id="g2" placeholder="e.g. 18,20,17,19"></textarea>

<label>Group 3:</label>
<textarea id="g3" placeholder="e.g. 22,24,23,25"></textarea>

<small>You can leave extra groups empty</small>

<button onclick="anova()">Calculate ANOVA</button>

<div class="result" id="output"></div>
</div>

<script>
function parseGroup(text) {
    return text.split(",").map(Number).filter(x => !isNaN(x));
}

function mean(arr) {
    return arr.reduce((a,b)=>a+b,0)/arr.length;
}

function anova() {
    let groups = [];
    let inputs = [g1.value, g2.value, g3.value];

    inputs.forEach(v => {
        let grp = parseGroup(v);
        if (grp.length > 0) groups.push(grp);
    });

    if (groups.length < 2) {
        output.innerHTML = "⚠️ Enter at least two groups.";
        return;
    }

    let allData = groups.flat();
    let grandMean = mean(allData);

    let ssBetween = 0, ssWithin = 0;
    let nTotal = allData.length;

    groups.forEach(g => {
        let m = mean(g);
        ssBetween += g.length * Math.pow(m - grandMean, 2);
        g.forEach(x => {
            ssWithin += Math.pow(x - m, 2);
        });
    });

    let dfBetween = groups.length - 1;
    let dfWithin = nTotal - groups.length;

    let msBetween = ssBetween / dfBetween;
    let msWithin = ssWithin / dfWithin;

    let F = msBetween / msWithin;

    let decision = F > 3.0 ? "Reject H₀ (Means are not equal)" 
                           : "Fail to Reject H₀";

    output.innerHTML = `
        <b>SS Between:</b> ${ssBetween.toFixed(4)}<br>
        <b>SS Within:</b> ${ssWithin.toFixed(4)}<br>
        <b>df Between:</b> ${dfBetween}<br>
        <b>df Within:</b> ${dfWithin}<br>
        <b>F Statistic:</b> ${F.toFixed(4)}<br><br>
        <b>Decision (α = 0.05):</b> ${decision}
    `;
}
</script>

</body>
</html>
