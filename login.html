<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | InSearchOfAverage</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-lg w-full max-w-md p-8">
    <h2 class="text-2xl font-bold text-center text-yellow-500 mb-6">
      Login
    </h2>

    <form id="loginForm" class="space-y-4">
      <input
        type="email"
        id="loginEmail"
        placeholder="Email"
        required
        class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"
      />

      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required
        class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"
      />

      <button
        type="submit"
        class="w-full bg-yellow-400 hover:bg-yellow-500 text-white font-semibold py-3 rounded">
        Login
      </button>
    </form>

    <p class="text-center mt-4 text-sm">
      Don’t have an account?
      <a href="signup.html" class="text-blue-600 hover:underline">Sign up</a>
    </p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e){
      e.preventDefault();
      alert("Login clicked (backend will be added later)");
    });
  </script>

</body>
</html>
